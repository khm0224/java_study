<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<ul>
		<li th:each="dto : ${list}">
			<!-- Link 처리하기 -->
			<a th:href="@{/sample/exView(sno=${dto.sno})}">[[${dto}]]</a>
			<!-- URL은 @{}을 쓰고, 변수나 파라미터 같은건 ${} -->
			<!-- URL?sno=? 이런거 처럼 Path에 파라미터 추가할거면 () 안에 넣으면 됨 -->
			
			<a th:href="@{/sample/exView/{sno}}">[[${dto}]]</a>
			<!-- {}는 URL 경로 자체에 변수를 넣을 수 있도록 해주는거 -->
			
			<a th:href="@{/sample/exView/{sno}(sno=${dto.sno})}">[[${dto}]]</a>
			<!-- 동적으로 URL 경로를 완성 -->
		</li>
	</ul>
</body>
</html>
